name: CI Fast

on:
  pull_request:
  push:
    branches: [master, phase-5-integrity-security-testing]

permissions:
  contents: read

concurrency:
  group: ci-fast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.14-alpine3.23@sha256:42b8b8b29c8a4e933d88943e5b03001a78794905cf786e6e7634e9f2abd5a0d3
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: infinityscan_ci
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U ci -d infinityscan_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://ci:ci_password@127.0.0.1:5432/infinityscan_ci
      TEST_DATABASE_URL: postgresql+psycopg://ci:ci_password@127.0.0.1:5432/infinityscan_ci
      APP_ENV: development
      COOKIE_SECURE: "false"
      TRUSTED_HOSTS: localhost,127.0.0.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install -r api/requirements-dev.txt
      - name: Ruff
        run: python -m ruff check api scripts --no-cache
      - name: Compile Python
        run: python -m compileall -q api scripts/backup_db.py scripts/dr_fixture.py
      - name: Upgrade database and check ORM drift
        run: |
          cd api
          alembic upgrade head
          alembic check
      - name: Migration graph and manifest
        run: python -m tools.migration_verifier check --json
        working-directory: api
      - name: Migration immutability
        run: python -m tools.migration_verifier check --json
        working-directory: api
      - name: Workflow policy
        run: python scripts/check-workflows.py
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Validate workflows
        run: '"$(go env GOPATH)/bin/actionlint" .github/workflows/*.yml'
      - name: Backend PostgreSQL tests
        run: >-
          python -m pytest api/tests scripts/tests
          --ignore=api/tests/integration/test_storage_minio.py
          --ignore=api/tests/test_integrity.py
          --ignore=api/tests/test_sessions_tool.py
          --deselect=api/tests/test_session.py::TestRotateRefreshSession::test_expired_token_returns_none
          --deselect=api/tests/test_session.py::TestIsSessionActive::test_expired_session -q
      - name: SQLite invalid-state compatibility tests
        env:
          DATABASE_URL: sqlite://
          TEST_DATABASE_URL: ""
        run: >-
          python -m pytest api/tests/test_integrity.py
          api/tests/test_sessions_tool.py
          api/tests/test_session.py::TestRotateRefreshSession::test_expired_token_returns_none
          api/tests/test_session.py::TestIsSessionActive::test_expired_session -q
      - name: Runtime dependency audit
        run: python -m pip_audit -r api/requirements.txt
      - name: Development dependency audit
        run: python -m pip_audit -r api/requirements-dev.txt

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: web
      - name: Unit tests
        run: npm test
        working-directory: web
      - name: ESLint
        run: npm run lint
        working-directory: web
      - name: TypeScript
        run: npx tsc --noEmit
        working-directory: web
      - name: Production build
        run: npm run build
        env:
          API_INTERNAL_URL: http://api:8000
        working-directory: web
      - name: Shared npm audit policy
        run: scripts/lib/npm-audit.sh web scripts/lib/npm-audit-exceptions.json "$RUNNER_TEMP/npm-audit.json"
