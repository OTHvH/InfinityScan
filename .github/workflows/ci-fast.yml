name: CI Fast

on:
  pull_request:
  push:
    branches: [master, phase-5-integrity-security-testing]

permissions:
  contents: read

concurrency:
  group: ci-fast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: infinityscan_ci
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U ci -d infinityscan_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://ci:ci_password@127.0.0.1:5432/infinityscan_ci
      APP_ENV: development
      COOKIE_SECURE: "false"
      TRUSTED_HOSTS: localhost,127.0.0.1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install -r api/requirements-dev.txt
      - name: Ruff
        run: >-
          ruff check api/importing api/storage api/providers api/tools
          api/audit_events.py api/middleware.py scripts/backup_db.py scripts/dr_fixture.py
      - name: Compile Python
        run: python -m compileall -q api scripts/backup_db.py scripts/dr_fixture.py
      - name: Upgrade database and check ORM drift
        run: |
          cd api
          alembic upgrade head
          alembic check
      - name: Migration graph and manifest
        run: python -m tools.migration_verifier check --json
        working-directory: api
      - name: Backend tests
        run: python -m pytest api/tests -q
      - name: Runtime dependency audit
        run: python -m pip_audit -r api/requirements.txt
      - name: Development dependency audit
        run: python -m pip_audit -r api/requirements-dev.txt

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: web
      - name: Unit tests
        run: npm test
        working-directory: web
      - name: ESLint
        run: npm run lint
        working-directory: web
      - name: TypeScript
        run: npx tsc --noEmit
        working-directory: web
      - name: Production build
        run: npm run build
        working-directory: web
      - name: Shared npm audit policy
        run: scripts/lib/npm-audit.sh web scripts/lib/npm-audit-exceptions.json "$RUNNER_TEMP/npm-audit.json"
