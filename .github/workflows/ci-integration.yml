name: CI Integration

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-minio:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies and native DR tools
        run: |
          python -m pip install -r api/requirements-dev.txt
          npm ci --prefix web
          sudo apt-get update
          sudo apt-get install --yes age jq postgresql-client
      - name: Run disposable DR backup and restore drill
        run: scripts/test-disaster-recovery.sh

  postgresql-minio-live:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.14-alpine3.23@sha256:42b8b8b29c8a4e933d88943e5b03001a78794905cf786e6e7634e9f2abd5a0d3
        env:
          POSTGRES_USER: integration
          POSTGRES_PASSWORD: integration_password
          POSTGRES_DB: phase5_migrations_integration
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U integration -d phase5_migrations_integration"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://integration:integration_password@127.0.0.1:5432/phase5_migrations_integration
      TASK6_SECOND_DATABASE_URL: postgresql+psycopg://integration:integration_password@127.0.0.1:5432/phase5_scratch_integration
      INFINITYSCAN_DISPOSABLE_MIGRATION_TEST: "1"
      INFINITYSCAN_DISPOSABLE_TEST: "1"
      RUN_MINIO_TESTS: "1"
      MINIO_TEST_ENDPOINT_URL: http://127.0.0.1:9000
      S3_REGION: auto
      S3_BUCKET: infinityscan-integration
      S3_ACCESS_KEY_ID: integration_minio
      S3_SECRET_ACCESS_KEY: integration_minio_password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install -r api/requirements-dev.txt
      - name: Ruff
        run: python -m ruff check api scripts --no-cache
      - name: Start disposable MinIO
        run: |
          test "$INFINITYSCAN_DISPOSABLE_MIGRATION_TEST" = "1"
          docker run --detach --name infinityscan-integration-minio \
            --publish 9000:9000 \
            --env MINIO_ROOT_USER="$S3_ACCESS_KEY_ID" \
            --env MINIO_ROOT_PASSWORD="$S3_SECRET_ACCESS_KEY" \
            quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e \
            server /data
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs infinityscan-integration-minio
          exit 1
      - name: Create isolated database and bucket
        run: |
          python - <<'PY'
          import boto3
          import psycopg

          with psycopg.connect(
              "postgresql://integration:integration_password@127.0.0.1:5432/postgres",
              autocommit=True,
          ) as connection:
              connection.execute("CREATE DATABASE phase5_scratch_integration")

          client = boto3.client(
              "s3",
              endpoint_url="http://127.0.0.1:9000",
              region_name="auto",
              aws_access_key_id="integration_minio",
              aws_secret_access_key="integration_minio_password",
          )
          client.create_bucket(Bucket="infinityscan-integration")
          PY
      - name: PostgreSQL and MinIO live tests without skips
        run: |
          python -m pytest api/tests_postgresql \
            --junitxml="$RUNNER_TEMP/postgresql-minio.xml" -q
          python - "$RUNNER_TEMP/postgresql-minio.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          report = ET.parse(sys.argv[1]).getroot()
          skipped = sum(int(suite.get("skipped", "0")) for suite in report.iter("testsuite"))
          if skipped:
              raise SystemExit(f"integration suite unexpectedly skipped {skipped} test(s)")
          PY
      - name: Stop disposable MinIO
        if: always()
        run: docker rm --force infinityscan-integration-minio >/dev/null 2>&1 || true

  same-origin-stack-smoke:
    runs-on: ubuntu-24.04
    env:
      COMPOSE_PROJECT_NAME: infinityscan-smoke-${{ github.run_id }}-${{ github.run_attempt }}
      INFINITYSCAN_ENV_FILE: /tmp/infinityscan-smoke-${{ github.run_id }}-${{ github.run_attempt }}.env
      POSTGRES_USER: smoke
      POSTGRES_PASSWORD: smoke_database_password
      POSTGRES_DB: infinityscan_smoke
      DATABASE_URL: postgresql+psycopg://smoke:smoke_database_password@db:5432/infinityscan_smoke
      JWT_SECRET_KEY: smoke_jwt_secret_key_abcdefghijklmnopqrstuvwxyz
      CSRF_SECRET_KEY: smoke_csrf_secret_key_abcdefghijklmnopqrstuvwxyz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and start synthetic stack
        run: |
          umask 077
          cat > "$INFINITYSCAN_ENV_FILE" <<'EOF'
          APP_ENV=development
          DATABASE_URL=postgresql+psycopg://smoke:smoke_database_password@db:5432/infinityscan_smoke
          JWT_SECRET_KEY=smoke_jwt_secret_key_abcdefghijklmnopqrstuvwxyz
          CSRF_SECRET_KEY=smoke_csrf_secret_key_abcdefghijklmnopqrstuvwxyz
          COOKIE_SECURE=false
          TRUSTED_HOSTS=localhost,127.0.0.1,api
          CORS_ORIGINS=http://localhost:3000
          OBJECT_STORAGE_ENABLED=false
          EOF
          docker compose --env-file "$INFINITYSCAN_ENV_FILE" \
            -f infra/docker-compose.yml up --detach --build db migrate api web
      - name: Verify same-origin API health
        run: |
          for _ in $(seq 1 60); do
            if payload=$(curl --fail --silent http://127.0.0.1:3000/api/health) \
              && PAYLOAD="$payload" python3 -c \
                'import json, os; assert json.loads(os.environ["PAYLOAD"])["status"] == "ok"'; then
              exit 0
            fi
            sleep 5
          done
          docker compose --env-file "$INFINITYSCAN_ENV_FILE" \
            -f infra/docker-compose.yml logs --no-color
          exit 1
      - name: Remove synthetic stack
        if: always()
        run: |
          if [ -f "$INFINITYSCAN_ENV_FILE" ]; then
            docker compose --env-file "$INFINITYSCAN_ENV_FILE" \
              -f infra/docker-compose.yml down --volumes --remove-orphans
            rm -f "$INFINITYSCAN_ENV_FILE"
          fi

  phase2-e2e:
    needs: postgres-minio
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -r api/requirements-dev.txt
      - run: npm ci --prefix web
      - run: scripts/verify-phase2.sh

  phase3-e2e:
    needs: postgres-minio
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -r api/requirements-dev.txt
      - run: npm ci --prefix web
      - run: scripts/verify-phase3.sh --phase-only

  phase4-e2e:
    needs: postgres-minio
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -r api/requirements-dev.txt
      - run: npm ci --prefix web
      - run: scripts/verify-phase4.sh --phase-only

  phase5-integrity:
    needs: postgres-minio
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - run: python -m pip install -r api/requirements-dev.txt
      - name: Phase 5 integrity and recovery tests
        env:
          PYTHONPATH: api
        run: >-
          python -m pytest
          api/tests/test_integrity.py
          api/tests/test_storage_integrity.py
          api/tests_phase5/test_import_recovery.py
          api/tests/test_sessions_tool.py
          api/tests/test_task7_audit.py -q
