name: Publish Immutable Multi-Architecture Images

on:
  workflow_dispatch:
    inputs:
      verification_run_id:
        description: "Successful Full Release Verification run for this exact commit"
        required: true
        type: string
      release_id:
        description: "Optional bounded release identifier; defaults to the workflow run"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: publish-images-${{ inputs.verification_run_id }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/phase-6-production-deployment'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      verified_sha: ${{ steps.release-run.outputs.sha }}
      verified_branch: ${{ steps.release-run.outputs.branch }}
    steps:
      - name: Verify trusted release run
        id: release-run
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          VERIFICATION_RUN_ID: ${{ inputs.verification_run_id }}
        run: |
          set -euo pipefail
          gh api "repos/${REPOSITORY}/actions/runs/${VERIFICATION_RUN_ID}" > "$RUNNER_TEMP/release-run.json"
          python3 - "$RUNNER_TEMP/release-run.json" "$REPOSITORY" <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import re
          import sys

          run = json.load(open(sys.argv[1], encoding="utf-8"))
          repository = sys.argv[2]
          if run.get("name") != "Full Release Verification":
              raise SystemExit("verification run is not Full Release Verification")
          if run.get("path") != ".github/workflows/release.yml":
              raise SystemExit("verification run used an unexpected workflow")
          if run.get("conclusion") != "success":
              raise SystemExit("verification run did not succeed")
          if run.get("event") not in {"push", "workflow_dispatch"}:
              raise SystemExit("verification run used an untrusted event")
          if run.get("head_repository", {}).get("full_name") != repository:
              raise SystemExit("verification run did not build this repository")
          branch = run.get("head_branch")
          if branch != "phase-6-production-deployment":
              raise SystemExit("verification run is not for the protected deployment branch")
          sha = run.get("head_sha", "")
          if not re.fullmatch(r"[0-9a-f]{40}", sha):
              raise SystemExit("verification run has an invalid commit SHA")
          print(f"sha={sha}")
          print(f"branch={branch}")
          PY
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ steps.release-run.outputs.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - name: Install workflow policy dependencies
        run: python -m pip install -r api/requirements-dev.txt
      - name: Confirm release inputs exist in verified commit
        run: |
          set -euo pipefail
          test -f api/Dockerfile
          test -f web/Dockerfile
          test -f api/requirements.txt
          test -f web/package.json
          test -f web/package-lock.json
          test -f infra/docker-compose.production.yml
          test -f scripts/deploy-production.sh
          test -f scripts/rollback-production.sh
          python3 scripts/check-workflows.py

  publish:
    needs: verify
    if: github.ref == 'refs/heads/phase-6-production-deployment'
    runs-on: ubuntu-24.04
    environment: image-publication
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      manifest: ${{ steps.manifest.outputs.path }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ needs.verify.outputs.verified_sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies for pre-publish checks
        run: |
          python -m pip install -r api/requirements-dev.txt
          npm ci --prefix web
      - name: Pre-publish source and dependency checks
        run: |
          set -euo pipefail
          python -m ruff check api scripts --no-cache
          python -m compileall -q api scripts
          PYTHONPATH=api python -m pytest api/tests scripts/tests -q
          npm test --prefix web
          npm run lint --prefix web
          npx --prefix web tsc --noEmit
          npm run build --prefix web
          python -m pip_audit -r api/requirements.txt
          python -m pip_audit -r api/requirements-dev.txt
          scripts/lib/npm-audit.sh web scripts/lib/npm-audit-exceptions.json "$RUNNER_TEMP/npm-audit.json"
          python3 scripts/check-workflows.py
          python3 scripts/validate-release-manifest.py --help >/dev/null
      - name: Build current-platform images for runtime inspection
        run: |
          set -euo pipefail
          docker build --tag infinityscan-api:publish-check api
          docker build --build-arg API_INTERNAL_URL=http://api:8000 \
            --tag infinityscan-web:publish-check web
          scripts/check-image-content.sh infinityscan-api:publish-check appuser
          scripts/check-image-content.sh infinityscan-web:publish-check nextjs
      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish API image
        id: build-api
        env:
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/infinityscan-api
          IMAGE_TAG: sha-${{ needs.verify.outputs.verified_sha }}
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: api
          file: api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ env.IMAGE_TAG }}
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.revision=${{ needs.verify.outputs.verified_sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}
      - name: Build and publish web image
        id: build-web
        env:
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/infinityscan-web
          IMAGE_TAG: sha-${{ needs.verify.outputs.verified_sha }}
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: web
          file: web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ env.IMAGE_TAG }}
          build-args: |
            API_INTERNAL_URL=http://api:8000
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.revision=${{ needs.verify.outputs.verified_sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}
      - name: Create and validate immutable release manifest
        id: manifest
        env:
          API_DIGEST: ${{ steps.build-api.outputs.digest }}
          WEB_DIGEST: ${{ steps.build-web.outputs.digest }}
          VERIFIED_SHA: ${{ needs.verify.outputs.verified_sha }}
          RELEASE_ID: ${{ inputs.release_id }}
          REPOSITORY: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          owner="${OWNER,,}"
          release_id="${RELEASE_ID:-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}}"
          api_repository="ghcr.io/${owner}/infinityscan-api"
          web_repository="ghcr.io/${owner}/infinityscan-web"
          [[ "$API_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$WEB_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          python3 - "$release_id" "$VERIFIED_SHA" "$REPOSITORY" \
            "$api_repository" "$API_DIGEST" "$web_repository" "$WEB_DIGEST" <<'PY'
          import hashlib
          import json
          import os
          import sys
          from datetime import datetime, timezone

          release_id, sha, repository, api_repo, api_digest, web_repo, web_digest = sys.argv[1:]
          manifest = {
              "schema_version": 1,
              "release_id": release_id,
              "git_sha": sha,
              "repository": repository,
              "created_at": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "lock_hashes": {
                  "api/requirements.txt": hashlib.sha256(open("api/requirements.txt", "rb").read()).hexdigest(),
                  "web/package-lock.json": hashlib.sha256(open("web/package-lock.json", "rb").read()).hexdigest(),
              },
              "images": {},
          }
          for name, repo, digest, dockerfile in (
              ("api", api_repo, api_digest, "api/Dockerfile"),
              ("web", web_repo, web_digest, "web/Dockerfile"),
          ):
              manifest["images"][name] = {
                  "repository": repo,
                  "digest": digest.removeprefix("sha256:"),
                  "reference": f"{repo}@{digest}",
                  "platforms": ["linux/amd64", "linux/arm64"],
                  "dockerfile": dockerfile,
              }
          with open("release-manifest.json", "w", encoding="utf-8") as stream:
              json.dump(manifest, stream, indent=2)
              stream.write("\n")
          PY
          python3 scripts/validate-release-manifest.py release-manifest.json
          {
            printf 'path=release-manifest.json\n'
            printf 'api_repository=%s\n' "$api_repository"
            printf 'web_repository=%s\n' "$web_repository"
            printf 'api_reference=%s@%s\n' "$api_repository" "$API_DIGEST"
            printf 'web_reference=%s@%s\n' "$web_repository" "$WEB_DIGEST"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-name: ${{ steps.manifest.outputs.api_repository }}
          subject-digest: ${{ steps.build-api.outputs.digest }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-name: ${{ steps.manifest.outputs.web_repository }}
          subject-digest: ${{ steps.build-web.outputs.digest }}
          push-to-registry: true
      - name: Scan final API image by digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.manifest.outputs.api_reference }}
          format: json
          output: api-trivy.json
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan final web image by digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.manifest.outputs.web_reference }}
          format: json
          output: web-trivy.json
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Write human-readable API vulnerability summary
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.manifest.outputs.api_reference }}
          format: table
          output: api-trivy.txt
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: "0"
      - name: Write human-readable web vulnerability summary
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.manifest.outputs.web_reference }}
          format: table
          output: web-trivy.txt
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: "0"
      - name: Generate final-image SBOMs
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.manifest.outputs.api_reference }}
          output-file: api-sbom.spdx.json
          format: spdx-json
          upload-artifact: false
      - name: Generate web final-image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.manifest.outputs.web_reference }}
          output-file: web-sbom.spdx.json
          format: spdx-json
          upload-artifact: false
      - uses: sigstore/cosign-installer@fb28c2b6339dcd94da6e4cbcbc5e888961f6f8c3 # v3.9.0
      - name: Sign immutable image digests
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "${{ steps.manifest.outputs.api_reference }}"
          cosign sign "${{ steps.manifest.outputs.web_reference }}"
      - name: Verify digests, platforms, signatures, provenance, and artifacts
        env:
          EXPECTED_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/publish-images.yml@refs/heads/${{ needs.verify.outputs.verified_branch }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import hashlib
          from pathlib import Path

          summary = {"passed": True, "images": {}}
          for component in ("api", "web"):
              sbom = Path(f"{component}-sbom.spdx.json")
              summary["images"][component] = {
                  "sbom_sha256": hashlib.sha256(sbom.read_bytes()).hexdigest(),
                  "trivy_report": f"{component}-trivy.json",
              }
          Path("scan-summary.json").write_text(json.dumps(summary, indent=2) + "\n", encoding="utf-8")
          PY
          scripts/verify-release-images.sh \
            --manifest release-manifest.json \
            --expected-repository "${GITHUB_REPOSITORY}" \
            --expected-workflow-identity "$EXPECTED_IDENTITY" \
            --expected-git-sha "${{ needs.verify.outputs.verified_sha }}" \
            --sbom-dir . \
            --scan-summary scan-summary.json
          for reference in "${{ steps.manifest.outputs.api_reference }}" "${{ steps.manifest.outputs.web_reference }}"; do
            docker buildx imagetools inspect "$reference" | grep -q 'linux/amd64'
            docker buildx imagetools inspect "$reference" | grep -q 'linux/arm64'
          done
          docker run --rm --entrypoint /bin/sh "${{ steps.manifest.outputs.api_reference }}" \
            -c 'test "$(id -un)" = appuser && python -c "import fastapi"'
          docker run --rm --entrypoint /bin/sh "${{ steps.manifest.outputs.web_reference }}" \
            -c 'test "$(id -un)" = nextjs && node -e "process.exit(0)"'
      - name: Bundle safe release artifact
        run: |
          set -euo pipefail
          mkdir -p release-artifact
          cp release-manifest.json api-sbom.spdx.json web-sbom.spdx.json \
            api-trivy.json web-trivy.json api-trivy.txt web-trivy.txt \
            scan-summary.json release-artifact/
          sha256sum api-sbom.spdx.json web-sbom.spdx.json > release-artifact/sbom-checksums.txt
          printf 'manifest_validation=passed\n' > release-artifact/validation-result.txt
          jq -r '.images | to_entries[] | "\(.key) \(.value.reference)"' \
            release-manifest.json > release-artifact/image-digest-summary.txt
          printf 'provenance=github-attest-build-provenance\n' > release-artifact/provenance-reference.txt
          printf 'signature_verification=cosign-keyless-oidc\n' > release-artifact/signature-verification.txt
          python3 scripts/validate-release-manifest.py release-artifact/release-manifest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: immutable-release-${{ needs.verify.outputs.verified_sha }}
          path: release-artifact
          if-no-files-found: error
          retention-days: 14
