name: Full Release Verification

on:
  workflow_dispatch:
  push:
    branches: [phase-5-integrity-security-testing]

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  phase1:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -r api/requirements-dev.txt
      - run: npm ci --prefix web
      - run: scripts/verify-phase1.sh --phase-only
  phase2:
    needs: phase1
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -r api/requirements-dev.txt
      - run: npm ci --prefix web
      - run: scripts/verify-phase2.sh --phase-only
  phase3:
    needs: phase2
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -r api/requirements-dev.txt
      - run: npm ci --prefix web
      - run: scripts/verify-phase3.sh --phase-only
  phase4:
    needs: phase3
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -r api/requirements-dev.txt
      - run: npm ci --prefix web
      - run: scripts/verify-phase4.sh --phase-only
  phase5:
    needs: phase4
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -r api/requirements-dev.txt
      - run: npm ci --prefix web
      - run: sudo apt-get update && sudo apt-get install --yes age jq postgresql-client shellcheck
      - run: mkdir -p "$GITHUB_WORKSPACE/.bin" && go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
        env:
          GOBIN: ${{ github.workspace }}/.bin
      - run: echo "${{ github.workspace }}/.bin" >> "$GITHUB_PATH"
      - run: scripts/verify-phase5.sh --phase-only
